{{- if and .Values.fleet.tinyproxy.enabled .Values.fleet.tinyproxy.ingress.enabled }}
{{- $proxy := .Values.fleet.tinyproxy }}
{{- if eq $proxy.ingress.httpEntryPoint $proxy.ingress.httpsEntryPoint }}
{{- fail "Tinyproxy HTTP and HTTPS entry points must differ" }}
{{- end }}
{{- range $tls := list false true }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "mock-fleet.tinyproxyFullname" $ }}-{{ ternary "https" "http" $tls }}
  namespace: {{ include "mock-fleet.namespace" $ }}
  labels:
    {{- include "mock-fleet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tinyproxy
spec:
  ingressClassName: {{ $proxy.ingress.className | quote }}
  entryPoints:
    - {{ ternary $proxy.ingress.httpsEntryPoint $proxy.ingress.httpEntryPoint $tls | quote }}
  routes:
    - match: {{ ternary (printf "HostSNI(`%s`)" $proxy.ingress.hostname) "HostSNI(`*`)" $tls | quote }}
      services:
        - name: {{ include "mock-fleet.tinyproxyFullname" $ }}
          port: {{ $proxy.service.ports.http }}
  {{- if $tls }}
  {{- if $proxy.ingress.tlsSecretName }}
  tls:
    secretName: {{ $proxy.ingress.tlsSecretName | quote }}
  {{- else }}
  tls: {}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
