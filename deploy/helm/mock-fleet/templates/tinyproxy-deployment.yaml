{{- if .Values.fleet.tinyproxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mock-fleet.tinyproxyFullname" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: tinyproxy
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.fleet.tinyproxy.replicas }}
  selector:
    matchLabels:
      {{- include "mock-fleet.tinyproxySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mock-fleet.tinyproxySelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/tinyproxy-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.fleet.tinyproxy.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tinyproxy
          image: {{ printf "%s:%s" .Values.fleet.tinyproxy.image.repository (default .Chart.AppVersion .Values.fleet.tinyproxy.image.tag) | quote }}
          imagePullPolicy: {{ .Values.fleet.tinyproxy.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: proxy
              containerPort: 8888
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 20
          resources:
            {{- toYaml .Values.fleet.tinyproxy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tinyproxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "mock-fleet.tinyproxyFullname" . }}
{{- end }}
