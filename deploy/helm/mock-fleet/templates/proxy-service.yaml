apiVersion: v1
kind: Service
metadata:
  name: {{ include "mock-fleet.proxyFullname" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.fleet.proxy.service.type }}
  selector:
    {{- include "mock-fleet.proxySelectorLabels" . | nindent 4 }}
  ports:
    - name: debug
      port: {{ .Values.fleet.proxy.service.ports.debug }}
      protocol: TCP
      targetPort: {{ .Values.fleet.proxy.service.ports.targetDebug }}
    - name: http
      port: {{ .Values.fleet.proxy.service.ports.http }}
      protocol: TCP
      targetPort: {{ .Values.fleet.proxy.service.ports.targetHttp }}
