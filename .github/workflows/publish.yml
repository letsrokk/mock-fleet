name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PROXY_IMAGE_NAME: ghcr.io/letsrokk/mock-fleet-proxy
  API_IMAGE_NAME: ghcr.io/letsrokk/mock-fleet-api
  DASH_IMAGE_NAME: ghcr.io/letsrokk/mock-fleet-dash
  CHART_DIR: deploy/helm/mock-fleet
  CHART_REGISTRY: oci://ghcr.io/letsrokk/charts

jobs:
  resolve-version:
    name: Resolve publish version
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      image_tags: ${{ steps.version.outputs.image_tags }}
      chart_version: ${{ steps.version.outputs.chart_version }}
      app_version: ${{ steps.version.outputs.app_version }}
      maven_version: ${{ steps.version.outputs.maven_version }}

    steps:
      - name: Resolve publish metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          if [[ -z "${version}" || "${version}" == "${GITHUB_REF_NAME}" ]]; then
            echo "Expected a tag named v<version>, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Expected a SemVer tag like v1.2.3 or v1.2.3-rc.1, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          image_tag="${version}"
          image_tags="$(printf 'type=raw,value=%s\ntype=raw,value=latest' "${version}")"

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          {
            echo "image_tags<<EOF"
            echo "${image_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "chart_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "maven_version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build application packages
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      maven_version: ${{ needs.resolve-version.outputs.maven_version }}

  publish:
    name: Publish images and chart
    needs:
      - resolve-version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download proxy package
        uses: actions/download-artifact@v4
        with:
          name: fleet-proxy-package
          path: fleet-proxy/target/quarkus-app

      - name: Download API package
        uses: actions/download-artifact@v4
        with:
          name: fleet-api-package
          path: fleet-api/target/quarkus-app

      - name: Download dashboard package
        uses: actions/download-artifact@v4
        with:
          name: fleet-dash-package
          path: fleet-dash/dist

      - name: Log in to GHCR for Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract proxy Docker metadata
        id: proxy_docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PROXY_IMAGE_NAME }}
          tags: |
            ${{ needs.resolve-version.outputs.image_tags }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mock-fleet-proxy
            org.opencontainers.image.description=Quarkus proxy image that routes HTTP requests to per-mock WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md
          annotations: |
            org.opencontainers.image.title=mock-fleet-proxy
            org.opencontainers.image.description=Quarkus proxy image that routes HTTP requests to per-mock WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract API Docker metadata
        id: api_docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            ${{ needs.resolve-version.outputs.image_tags }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mock-fleet-api
            org.opencontainers.image.description=Quarkus API image that manages mock-fleet WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md
          annotations: |
            org.opencontainers.image.title=mock-fleet-api
            org.opencontainers.image.description=Quarkus API image that manages mock-fleet WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md

      - name: Extract dashboard Docker metadata
        id: dash_docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASH_IMAGE_NAME }}
          tags: |
            ${{ needs.resolve-version.outputs.image_tags }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mock-fleet-dash
            org.opencontainers.image.description=Static dashboard image for mock-fleet.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md
          annotations: |
            org.opencontainers.image.title=mock-fleet-dash
            org.opencontainers.image.description=Static dashboard image for mock-fleet.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md

      - name: Verify Docker image tags
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.resolve-version.outputs.image_tag }}
          PROXY_TAGS: ${{ steps.proxy_docker_metadata.outputs.tags }}
          API_TAGS: ${{ steps.api_docker_metadata.outputs.tags }}
          DASH_TAGS: ${{ steps.dash_docker_metadata.outputs.tags }}
        run: |
          set -euo pipefail

          require_tag() {
            local name="$1"
            local tags="$2"
            local expected="$3"

            if ! grep -Fxq "${expected}" <<< "${tags}"; then
              echo "${name} Docker metadata did not include expected tag ${expected}" >&2
              echo "Resolved tags:" >&2
              echo "${tags}" >&2
              exit 1
            fi
          }

          require_tag "proxy" "${PROXY_TAGS}" "${PROXY_IMAGE_NAME}:${IMAGE_TAG}"
          require_tag "API" "${API_TAGS}" "${API_IMAGE_NAME}:${IMAGE_TAG}"
          require_tag "dashboard" "${DASH_TAGS}" "${DASH_IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build and push proxy Docker image
        uses: docker/build-push-action@v6
        with:
          context: fleet-proxy
          file: fleet-proxy/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.proxy_docker_metadata.outputs.tags }}
          labels: ${{ steps.proxy_docker_metadata.outputs.labels }}
          annotations: ${{ steps.proxy_docker_metadata.outputs.annotations }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: fleet-api
          file: fleet-api/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.api_docker_metadata.outputs.tags }}
          labels: ${{ steps.api_docker_metadata.outputs.labels }}
          annotations: ${{ steps.api_docker_metadata.outputs.annotations }}

      - name: Build and push dashboard Docker image
        uses: docker/build-push-action@v6
        with:
          context: fleet-dash
          file: fleet-dash/Dockerfile
          push: true
          tags: ${{ steps.dash_docker_metadata.outputs.tags }}
          labels: ${{ steps.dash_docker_metadata.outputs.labels }}
          annotations: ${{ steps.dash_docker_metadata.outputs.annotations }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build Helm chart dependencies
        run: helm dependency build "${CHART_DIR}"

      - name: Lint Helm chart
        run: helm lint "${CHART_DIR}"

      - name: Package Helm chart
        run: helm package "${CHART_DIR}" --version "${{ needs.resolve-version.outputs.chart_version }}" --app-version "${{ needs.resolve-version.outputs.app_version }}"

      - name: Verify Helm chart image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.resolve-version.outputs.image_tag }}
          CHART_VERSION: ${{ needs.resolve-version.outputs.chart_version }}
        run: |
          set -euo pipefail

          chart_package="mock-fleet-${CHART_VERSION}.tgz"
          chart_app_version="$(helm show chart "${chart_package}" | sed -nE 's/^appVersion:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p')"

          if [[ "${chart_app_version}" != "${IMAGE_TAG}" ]]; then
            echo "Packaged chart appVersion ${chart_app_version} does not match Docker image tag ${IMAGE_TAG}" >&2
            exit 1
          fi

          rendered="$(helm template mock-fleet "${chart_package}")"

          for image in "${PROXY_IMAGE_NAME}" "${API_IMAGE_NAME}" "${DASH_IMAGE_NAME}"; do
            if ! grep -Fq "image: ${image}:${IMAGE_TAG}" <<< "${rendered}"; then
              echo "Rendered chart did not include image ${image}:${IMAGE_TAG}" >&2
              exit 1
            fi
          done

      - name: Push Helm chart
        run: helm push "mock-fleet-${{ needs.resolve-version.outputs.chart_version }}.tgz" "${CHART_REGISTRY}"
