name: Cluster E2E

on:
  workflow_dispatch:
    inputs:
      keep_failed_resources:
        description: Keep the isolated namespace and bucket after a failed run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mock-fleet-cluster-e2e-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cluster-e2e:
    name: Minikube and SeaweedFS contracts (${{ matrix.routing_mode }})
    runs-on: [self-hosted, linux, mock-fleet-e2e]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        routing_mode: [PATH, HOST]
    env:
      MOCK_FLEET_E2E_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.routing_mode }}
      MOCK_FLEET_E2E_IMAGE_TAG: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      MOCK_FLEET_E2E_ROUTING_MODE: ${{ matrix.routing_mode }}
      MOCK_FLEET_E2E_S3_ACCESS_KEY: ${{ secrets.MOCK_FLEET_E2E_S3_ACCESS_KEY }}
      MOCK_FLEET_E2E_S3_SECRET_KEY: ${{ secrets.MOCK_FLEET_E2E_S3_SECRET_KEY }}
      MOCK_FLEET_E2E_S3_ENDPOINT: ${{ vars.MOCK_FLEET_E2E_S3_ENDPOINT }}
      MOCK_FLEET_E2E_STORAGE_CLASS: ${{ vars.MOCK_FLEET_E2E_STORAGE_CLASS }}
      MOCK_FLEET_E2E_S3_PROVISIONER: ${{ vars.MOCK_FLEET_E2E_S3_PROVISIONER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test cluster harness
        run: bin/cluster-e2e.sh --self-test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: fleet-dash/package-lock.json

      - name: Build JVM applications
        run: |
          ./fleet-api/mvnw -B -f fleet-api/pom.xml package -DskipTests -Dquarkus.container-image.build=false
          ./fleet-proxy/mvnw -B -f fleet-proxy/pom.xml package -DskipTests -Dquarkus.container-image.build=false
          ./fleet-api/mvnw -B -f fleet-mcp/pom.xml package -DskipTests -Dquarkus.container-image.build=false

      - name: Build dashboard
        working-directory: fleet-dash
        run: |
          npm ci
          npm run build

      - name: Build images inside Minikube
        run: |
          minikube image build -f fleet-api/src/main/docker/Dockerfile.jvm -t "ghcr.io/letsrokk/mock-fleet/api:${MOCK_FLEET_E2E_IMAGE_TAG}" fleet-api
          minikube image build -f fleet-proxy/src/main/docker/Dockerfile.jvm -t "ghcr.io/letsrokk/mock-fleet/proxy:${MOCK_FLEET_E2E_IMAGE_TAG}" fleet-proxy
          minikube image build -f fleet-mcp/src/main/docker/Dockerfile.jvm -t "ghcr.io/letsrokk/mock-fleet/mcp:${MOCK_FLEET_E2E_IMAGE_TAG}" fleet-mcp
          minikube image build -t "ghcr.io/letsrokk/mock-fleet/dash:${MOCK_FLEET_E2E_IMAGE_TAG}" fleet-dash

      - name: Run live cluster suite
        run: bin/cluster-e2e.sh ${{ inputs.keep_failed_resources && '--keep' || '' }}
