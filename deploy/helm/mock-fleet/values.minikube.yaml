ingress:
  enabled: true
  host: mock-fleet.localhost
  className: nginx

fleet:
  proxy:
    routing:
      mode: "HOST"
    replicas: 1
  api:
    replicas: 1
    storage:
      persistent: true
      type: s3
      s3:
        storageClassName: seaweedfs-s3
        bucket: "default-bucket"
        mountOptions:
          - endpoint-url http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
          - force-path-style
          - region us-east-1
          - prefix mock-fleet/

