nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

image:
  repository: ghcr.io/letsrokk/mock-fleet
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http: 80
    targetHttp: 8080
    debug: 5005
    targetDebug: 5005

routing:
  mode: HOST

ingress:
  enabled: false
  host: mock-fleet.localhost
  className: ""
  annotations: {}
  tls: []
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: "0.5"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

securityContext:
  runAsNonRoot: true

storage:
  persistent: false
  type: s3
  annotations: {}
  s3:
    provisioner: s3.csi.aws.com
    storageClassName: ""
    bucket: ""
    path: /mock-fleet
    authenticationSource: driver
    cacheSize: 1Gi
    mountOptions: []

probes:
  liveness:
    path: /__fleet/health/live
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    path: /__fleet/health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  startup:
    path: /__fleet/health/started
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    successThreshold: 1
    failureThreshold: 3

env:
  mockFleetNamespace: mock-fleet
  mockFleetInactivityThreshold: 1M
  mockFleetPodCreationTimeout: 1M
  quinoaUiDir: /workspace/src/main/webui
  quarkusPackageOutputDirectory: /workspace/target
  javaOpts: -Dhazelcast.client.config=/etc/hazelcast/hazelcast-client.yaml
  userDir: /workspace

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

hazelcastClient:
  clusterName: dev

hazelcast:
  cluster:
    memberCount: 1
