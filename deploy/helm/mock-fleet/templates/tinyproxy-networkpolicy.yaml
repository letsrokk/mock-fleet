{{- if .Values.fleet.tinyproxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mock-fleet.tinyproxyFullname" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: tinyproxy
spec:
  podSelector:
    matchLabels:
      {{- include "mock-fleet.tinyproxySelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8888
  egress:
    {{- if .Values.fleet.tinyproxy.networkPolicy.ingressPodSelector }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.fleet.tinyproxy.networkPolicy.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.fleet.tinyproxy.networkPolicy.ingressPodSelector | nindent 14 }}
      ports:
        {{- range .Values.fleet.tinyproxy.networkPolicy.ingressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- range .Values.fleet.tinyproxy.networkPolicy.allowedCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.fleet.tinyproxy.networkPolicy.dnsNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.fleet.tinyproxy.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
