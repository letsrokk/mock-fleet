{{- if .Values.fleet.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mock-fleet.mcpFullname" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.fleet.mcp.service.type }}
  selector:
    {{- include "mock-fleet.mcpSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.fleet.mcp.service.ports.http }}
      protocol: TCP
      targetPort: {{ .Values.fleet.mcp.service.ports.targetHttp }}
{{- end }}
