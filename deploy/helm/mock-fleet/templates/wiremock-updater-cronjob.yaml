{{- if .Values.wiremock.versionUpdater.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mock-fleet.wiremockUpdaterFullname" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: wiremock-updater
spec:
  schedule: {{ .Values.wiremock.versionUpdater.schedule | quote }}
  timeZone: {{ .Values.wiremock.versionUpdater.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "mock-fleet.wiremockUpdaterSelectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ required "wiremock.versionUpdater.serviceAccount.name is required when serviceAccount.create=false" (include "mock-fleet.wiremockUpdaterServiceAccountName" .) }}
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: wiremock-updater
              image: {{ printf "%s:%s" .Values.wiremock.versionUpdater.image.repository (.Values.wiremock.versionUpdater.image.tag | default .Chart.AppVersion) }}
              imagePullPolicy: {{ .Values.wiremock.versionUpdater.image.pullPolicy }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: MOCK_FLEET_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: MOCK_FLEET_WIREMOCK_VERSION_CATALOG_CONFIG_MAP_NAME
                  value: {{ include "mock-fleet.wiremockVersionCatalogConfigMapName" . | quote }}
                - name: MOCK_FLEET_WIREMOCK_BASELINE_CONFIG_MAP_NAME
                  value: {{ include "mock-fleet.wiremockConfigMapName" . | quote }}
                - name: MOCK_FLEET_WIREMOCK_USER_CONFIG_MAP_NAME
                  value: {{ include "mock-fleet.wiremockUserConfigMapName" . | quote }}
                - name: MOCK_FLEET_WIREMOCK_CONFIG_KEY
                  value: wiremock-options.yaml
                - name: MOCK_FLEET_WIREMOCK_REGISTRY_URL
                  value: {{ .Values.wiremock.versionUpdater.registry.url | quote }}
                - name: MOCK_FLEET_WIREMOCK_REPOSITORY
                  value: {{ .Values.wiremock.versionUpdater.registry.repository | quote }}
                - name: MOCK_FLEET_WIREMOCK_DEFAULT_VERSION_CONSTRAINT
                  value: {{ .Values.wiremock.versionUpdater.defaultVersionConstraint | quote }}
                - name: MOCK_FLEET_WIREMOCK_MINOR_LINES
                  value: {{ .Values.wiremock.versionUpdater.minorLines | quote }}
                {{- with .Values.wiremock.versionUpdater.registry.credentialsSecretName }}
                - name: MOCK_FLEET_WIREMOCK_REGISTRY_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ . | quote }}
                      key: username
                - name: MOCK_FLEET_WIREMOCK_REGISTRY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ . | quote }}
                      key: password
                {{- end }}
              resources:
                {{- toYaml .Values.wiremock.versionUpdater.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
