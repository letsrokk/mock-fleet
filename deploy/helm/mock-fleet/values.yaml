nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterDomain: cluster.local

fleet:
  proxy:
    dev:
      enabled: false
      quarkusLaunchDevmode: "true"
      javaToolOptions: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    image:
      repository: ghcr.io/letsrokk/mock-fleet/proxy
      tag: ""
      pullPolicy: IfNotPresent
    routing:
      mode: HOST
    logging:
      json: false
      level: INFO
    replicas: 2
    service:
      type: ClusterIP
      ports:
        http: 80
        targetHttp: 8080
        debug: 5005
        targetDebug: 5005
    probes:
      liveness:
        path: /__fleet/proxy/health/live
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      readiness:
        path: /__fleet/proxy/health/ready
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
      startup:
        path: /__fleet/proxy/health/started
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        successThreshold: 1
        failureThreshold: 3
    resources:
      requests:
        cpu: "0.25"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  api:
    dev:
      enabled: false
      quarkusLaunchDevmode: "true"
      javaToolOptions: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    image:
      repository: ghcr.io/letsrokk/mock-fleet/api
      tag: ""
      pullPolicy: IfNotPresent
    podInactivityThreshold: 1M
    podCreationTimeout: 1M
    logging:
      json: false
      level: INFO
    replicas: 2
    terminationGracePeriodSeconds: 30
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1
    pdb:
      enabled: true
      minAvailable: 1
    service:
      type: ClusterIP
      ports:
        http: 80
        targetHttp: 8080
        debug: 5006
        targetDebug: 5005
    probes:
      liveness:
        path: /__fleet/api/health/live
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      readiness:
        path: /__fleet/api/health/ready
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
      startup:
        path: /__fleet/api/health/started
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        successThreshold: 1
        failureThreshold: 30
    resources:
      requests:
        cpu: "0.5"
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  dash:
    enabled: true
    image:
      repository: ghcr.io/letsrokk/mock-fleet/dash
      tag: ""
      pullPolicy: IfNotPresent
    replicas: 1
    service:
      type: ClusterIP
      ports:
        http: 80
        targetHttp: 8080
    probes:
      liveness:
        path: /__fleet/dash/health/live
        initialDelaySeconds: 5
        periodSeconds: 20
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      readiness:
        path: /__fleet/dash/health/ready
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      startup:
        path: /__fleet/dash/health/started
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 10
        successThreshold: 1
        failureThreshold: 3
    resources:
      requests:
        cpu: "0.05"
        memory: 64Mi
      limits:
        cpu: "0.25"
        memory: 128Mi
  mcp:
    enabled: false
    image:
      repository: ghcr.io/letsrokk/mock-fleet/mcp
      tag: ""
      pullPolicy: IfNotPresent
    replicas: 1
    apiBaseUrl: ""
    proxyBaseUrl: ""
    routing:
      mode: ""
      fleetHost: ""
    allowedOrigins: []
    outbound:
      exceptions: []
      allowedListeners: []
      networkPolicy:
        enabled: true
        dnsNamespace: kube-system
        dnsPodSelector:
          k8s-app: kube-dns
        allowedCidrs: []
    sensitiveHeaders:
      - Authorization
      - Proxy-Authorization
      - Cookie
      - Set-Cookie
      - X-API-Key
    timeout: 10S
    defaultPageSize: 50
    maxPageSize: 200
    maxPayloadBytes: 1048576
    includedBodyBytes: 262144
    service:
      type: ClusterIP
      ports:
        http: 80
        targetHttp: 8080
    probes:
      liveness:
        path: /__fleet/mcp/health/live
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      readiness:
        path: /__fleet/mcp/health/ready
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
      startup:
        path: /__fleet/mcp/health/started
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        successThreshold: 1
        failureThreshold: 30
    resources:
      requests:
        cpu: "0.1"
        memory: 128Mi
      limits:
        cpu: "0.5"
        memory: 512Mi

wiremock:
  podNamePrefix: mock-fleet
  containerName: wiremock
  containerImage: wiremock/wiremock:3.13.2-2
  containerImagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  config:
    default:
      options: []
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    mocks: []

storage:
  persistent: false
  type: s3
  mappingsPath: /workspace/mappings
  annotations: {}
  s3:
    provisioner: s3.csi.aws.com
    storageClassName: ""
    bucket: ""
    path: /mock-fleet
    authenticationSource: driver
    cacheSize: 1Gi
    mountOptions:
      - allow-delete

ingress:
  enabled: false
  host: mock-fleet.localhost
  className: ""
  annotations: {}
  tls: []
  path: /
  pathType: Prefix

securityContext:
  runAsNonRoot: true

env:
  javaOpts: ""
  userDir: /workspace

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

hazelcast:
  clusterName: mock-fleet
  port: 5701
  backupCount: 1
  gracefulShutdownMaxWaitSeconds: 30
