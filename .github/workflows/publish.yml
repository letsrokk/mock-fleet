name: Publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PROXY_IMAGE_NAME: ghcr.io/letsrokk/mock-fleet-proxy
  API_IMAGE_NAME: ghcr.io/letsrokk/mock-fleet-api
  DASH_IMAGE_NAME: ghcr.io/letsrokk/mock-fleet-dash
  CHART_DIR: deploy/helm/mock-fleet
  CHART_REGISTRY: oci://ghcr.io/letsrokk/charts

jobs:
  publish:
    name: Publish image and chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve publish metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail

          slugify() {
            local value="$1"

            value="$(printf '%s' "${value}" | tr '[:upper:]' '[:lower:]')"
            value="$(printf '%s' "${value}" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
            value="${value:0:80}"
            value="$(printf '%s' "${value}" | sed -E 's/^-+//; s/-+$//')"

            if [[ -z "${value}" ]]; then
              value="branch"
            fi

            if [[ "${value}" =~ ^[0-9] ]]; then
              value="branch-${value}"
            fi

            printf '%s' "${value}"
          }

          append_slug_to_version() {
            local version="$1"
            local slug="$2"

            if [[ "${version}" == *-SNAPSHOT ]]; then
              printf '%s-%s-SNAPSHOT' "${version%-SNAPSHOT}" "${slug}"
            else
              printf '%s-%s' "${version}" "${slug}"
            fi
          }

          pom_version="$(sed -nE '0,/<version>[^<]+<\/version>/s/.*<version>([^<]+)<\/version>.*/\1/p' fleet-proxy/pom.xml)"
          chart_base_version="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' "${CHART_DIR}/Chart.yaml" | head -n 1)"

          if [[ -z "${pom_version}" ]]; then
            echo "Could not resolve Maven project version from fleet-proxy/pom.xml" >&2
            exit 1
          fi

          if [[ -z "${chart_base_version}" ]]; then
            echo "Could not resolve Helm chart version from ${CHART_DIR}/Chart.yaml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"

            if [[ -z "${version}" || "${version}" == "${GITHUB_REF_NAME}" ]]; then
              echo "Expected a tag named v<version>, got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi

            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Expected a SemVer tag like v1.2.3 or v1.2.3-rc.1, got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi

            image_tag="${version}"
            image_tags="$(printf 'type=raw,value=%s\ntype=raw,value=latest' "${version}")"
            chart_version="${version}"
            app_version="${version}"
          else
            branch_slug="$(slugify "${GITHUB_REF_NAME}")"
            image_tag="${branch_slug}"
            image_tags="$(printf 'type=raw,value=%s' "${branch_slug}")"
            chart_version="$(append_slug_to_version "${chart_base_version}" "${branch_slug}")"
            app_version="$(append_slug_to_version "${pom_version}" "${branch_slug}")"
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          {
            echo "image_tags<<EOF"
            echo "${image_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: fleet-dash/package-lock.json

      - name: Set proxy version
        working-directory: fleet-proxy
        run: ./mvnw -B versions:set -DnewVersion="${{ steps.version.outputs.app_version }}" -DgenerateBackupPoms=false

      - name: Set API version
        working-directory: fleet-api
        run: ./mvnw -B versions:set -DnewVersion="${{ steps.version.outputs.app_version }}" -DgenerateBackupPoms=false

      - name: Build proxy
        working-directory: fleet-proxy
        run: ./mvnw -B package -Dquarkus.container-image.build=false

      - name: Build API
        working-directory: fleet-api
        run: ./mvnw -B package -Dquarkus.container-image.build=false

      - name: Build dashboard
        working-directory: fleet-dash
        run: npm ci && npm run build

      - name: Log in to GHCR for Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract proxy Docker metadata
        id: proxy_docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PROXY_IMAGE_NAME }}
          tags: |
            ${{ steps.version.outputs.image_tags }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mock-fleet-proxy
            org.opencontainers.image.description=Quarkus proxy image that routes HTTP requests to per-mock WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md
          annotations: |
            org.opencontainers.image.title=mock-fleet-proxy
            org.opencontainers.image.description=Quarkus proxy image that routes HTTP requests to per-mock WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract API Docker metadata
        id: api_docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            ${{ steps.version.outputs.image_tags }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mock-fleet-api
            org.opencontainers.image.description=Quarkus API image that manages mock-fleet WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md
          annotations: |
            org.opencontainers.image.title=mock-fleet-api
            org.opencontainers.image.description=Quarkus API image that manages mock-fleet WireMock pods.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md

      - name: Extract dashboard Docker metadata
        id: dash_docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASH_IMAGE_NAME }}
          tags: |
            ${{ steps.version.outputs.image_tags }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=mock-fleet-dash
            org.opencontainers.image.description=Static dashboard image for mock-fleet.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md
          annotations: |
            org.opencontainers.image.title=mock-fleet-dash
            org.opencontainers.image.description=Static dashboard image for mock-fleet.
            org.opencontainers.image.documentation=https://github.com/letsrokk/mock-fleet/blob/main/README.docker.md

      - name: Build and push proxy Docker image
        uses: docker/build-push-action@v6
        with:
          context: fleet-proxy
          file: fleet-proxy/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.proxy_docker_metadata.outputs.tags }}
          labels: ${{ steps.proxy_docker_metadata.outputs.labels }}
          annotations: ${{ steps.proxy_docker_metadata.outputs.annotations }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: fleet-api
          file: fleet-api/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.api_docker_metadata.outputs.tags }}
          labels: ${{ steps.api_docker_metadata.outputs.labels }}
          annotations: ${{ steps.api_docker_metadata.outputs.annotations }}

      - name: Build and push dashboard Docker image
        uses: docker/build-push-action@v6
        with:
          context: fleet-dash
          file: fleet-dash/Dockerfile
          push: true
          tags: ${{ steps.dash_docker_metadata.outputs.tags }}
          labels: ${{ steps.dash_docker_metadata.outputs.labels }}
          annotations: ${{ steps.dash_docker_metadata.outputs.annotations }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build Helm chart dependencies
        run: helm dependency build "${CHART_DIR}"

      - name: Lint Helm chart
        run: helm lint "${CHART_DIR}"

      - name: Package Helm chart
        run: helm package "${CHART_DIR}" --version "${{ steps.version.outputs.chart_version }}" --app-version "${{ steps.version.outputs.app_version }}"

      - name: Push Helm chart
        run: helm push "mock-fleet-${{ steps.version.outputs.chart_version }}.tgz" "${CHART_REGISTRY}"
