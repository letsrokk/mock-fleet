ingress:
  enabled: true
  host: mock-fleet.localhost

routing:
  mode: HOST

resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    cpu: "2"
    memory: 4Gi

storage:
  createPersistentVolume: false
  storageClassName: seaweedfs-s3
  pvcName: mock-fleet-wiremock-mappings

env:
  quarkusLaunchDevmode: "true"
  javaToolOptions: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
