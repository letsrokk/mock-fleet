name: Build

on:
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      build_all:
        description: Build every module and upload every package for release publishing.
        required: false
        default: false
        type: boolean
      maven_version:
        description: Maven project version to use for packaged API/proxy/MCP/Mock Ops artifacts.
        required: false
        default: ""
        type: string
      dash_version:
        description: Dashboard app version to bake into the static bundle.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-26.04

    outputs:
      proxy: ${{ inputs.build_all || steps.filter.outputs.proxy == 'true' }}
      api: ${{ inputs.build_all || steps.filter.outputs.api == 'true' }}
      mcp: ${{ inputs.build_all || steps.filter.outputs.mcp == 'true' }}
      mock_ops: ${{ inputs.build_all || steps.filter.outputs.mock_ops == 'true' }}
      dash: ${{ inputs.build_all || steps.filter.outputs.dash == 'true' }}
      wiremock_matrix: ${{ inputs.build_all || steps.filter.outputs.wiremock_matrix == 'true' }}

    steps:
      - name: Checkout
        if: ${{ !inputs.build_all }}
        uses: actions/checkout@v7.0.1

      - name: Detect changed modules
        id: filter
        if: ${{ !inputs.build_all }}
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.event.created && github.event.repository.default_branch || github.ref }}
          filters: |
            proxy:
              - 'fleet-proxy/**'
              - '.github/workflows/build.yml'
            api:
              - 'fleet-api/**'
              - '.github/workflows/build.yml'
            mcp:
              - 'fleet-mcp/**'
              - 'fleet-api/mvnw'
              - 'fleet-api/.mvn/**'
              - '.github/workflows/build.yml'
            mock_ops:
              - 'fleet-mock-ops/**'
              - '.github/workflows/build.yml'
            wiremock_matrix:
              - 'fleet-api/tests/verify-wiremock-option-matrix.sh'
              - 'fleet-api/src/main/resources/wiremock-option-compatibility.json'
              - '.github/workflows/build.yml'
            dash:
              - 'fleet-dash/**'
              - '.github/workflows/build.yml'

  fleet-proxy:
    name: Build fleet-proxy
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: fleet-proxy/pom.xml

      - name: Set proxy version
        if: ${{ inputs.maven_version != '' }}
        working-directory: fleet-proxy
        run: ./mvnw -B versions:set -DnewVersion="${{ inputs.maven_version }}" -DgenerateBackupPoms=false

      - name: Build proxy
        working-directory: fleet-proxy
        run: ./mvnw -B package -Dquarkus.container-image.build=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-proxy-test-reports
          path: fleet-proxy/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload proxy package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-proxy-package
          path: fleet-proxy/target/quarkus-app
          if-no-files-found: error

  fleet-api:
    name: Build fleet-api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: fleet-api/pom.xml

      - name: Set API version
        if: ${{ inputs.maven_version != '' }}
        working-directory: fleet-api
        run: ./mvnw -B versions:set -DnewVersion="${{ inputs.maven_version }}" -DgenerateBackupPoms=false

      - name: Build API
        working-directory: fleet-api
        run: ./mvnw -B package -Dquarkus.container-image.build=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-api-test-reports
          path: fleet-api/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload API package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-api-package
          path: fleet-api/target/quarkus-app
          if-no-files-found: error

  fleet-mcp:
    name: Build fleet-mcp
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: fleet-mcp/pom.xml

      - name: Set MCP version
        if: ${{ inputs.maven_version != '' }}
        run: ./fleet-api/mvnw -B -f fleet-mcp/pom.xml versions:set -DnewVersion="${{ inputs.maven_version }}" -DgenerateBackupPoms=false

      - name: Build MCP
        run: ./fleet-api/mvnw -B -f fleet-mcp/pom.xml package -Dquarkus.container-image.build=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-mcp-test-reports
          path: fleet-mcp/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload MCP package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-mcp-package
          path: fleet-mcp/target/quarkus-app
          if-no-files-found: error

  fleet-mock-ops:
    name: Build fleet-mock-ops
    needs: changes
    if: needs.changes.outputs.mock_ops == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: fleet-mock-ops/pom.xml

      - name: Set Mock Ops version
        if: ${{ inputs.maven_version != '' }}
        working-directory: fleet-mock-ops
        run: ./mvnw -B versions:set -DnewVersion="${{ inputs.maven_version }}" -DgenerateBackupPoms=false

      - name: Build Mock Ops
        working-directory: fleet-mock-ops
        run: ./mvnw -B package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-mock-ops-test-reports
          path: fleet-mock-ops/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload Mock Ops package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-mock-ops-package
          path: fleet-mock-ops/target/quarkus-app
          if-no-files-found: error

  fleet-dash:
    name: Build fleet-dash
    needs: changes
    if: needs.changes.outputs.dash == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: fleet-dash/package-lock.json

      - name: Install dashboard dependencies
        working-directory: fleet-dash
        run: npm ci

      - name: Test dashboard
        working-directory: fleet-dash
        run: npm test

      - name: Build dashboard
        working-directory: fleet-dash
        env:
          VITE_APP_VERSION: ${{ inputs.dash_version }}
        run: npm run build

      - name: Upload dashboard package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-dash-package
          path: fleet-dash/dist
          if-no-files-found: error

  wiremock-matrix:
    name: Verify WireMock option matrix
    needs: changes
    if: needs.changes.outputs.wiremock_matrix == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify WireMock 3.x option matrix
        run: fleet-api/tests/verify-wiremock-option-matrix.sh
