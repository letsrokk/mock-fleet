{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mock-fleet.fullname" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "mock-fleet.apiFullname" . }}
                port:
                  name: http
            path: /__fleet/api/health
            pathType: Prefix
          - backend:
              service:
                name: {{ include "mock-fleet.apiFullname" . }}
                port:
                  name: http
            path: /__fleet/api
            pathType: Prefix
          - backend:
              service:
                name: {{ include "mock-fleet.proxyFullname" . }}
                port:
                  name: http
            path: /__fleet/proxy/health
            pathType: Prefix
          - backend:
              service:
                name: {{ include "mock-fleet.proxyFullname" . }}
                port:
                  name: http
            path: /__fleet/proxy/version
            pathType: Prefix
          {{- if .Values.fleet.mcp.enabled }}
          - backend:
              service:
                name: {{ include "mock-fleet.mcpFullname" . }}
                port:
                  name: http
            path: /__fleet/mcp
            pathType: Prefix
          {{- end }}
          {{- if .Values.fleet.dash.enabled }}
          - backend:
              service:
                name: {{ include "mock-fleet.dashFullname" . }}
                port:
                  name: http
            path: /__fleet/dash/health
            pathType: Prefix
          - backend:
              service:
                name: {{ include "mock-fleet.dashFullname" . }}
                port:
                  name: http
            path: /__fleet
            pathType: Prefix
          {{- end }}
          - backend:
              service:
                name: {{ include "mock-fleet.proxyFullname" . }}
                port:
                  name: http
            path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
    {{- if eq .Values.fleet.proxy.routing.mode "HOST" }}
    - host: {{ printf "*.%s" $host | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "mock-fleet.proxyFullname" . }}
                port:
                  name: http
            path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
    {{- end }}
{{- end }}
