# Merge with your Fleet AWS values; replace all example network/certificate values.
fleet:
  mitmproxy:
    enabled: true
    ingress:
      enabled: false
    service:
      loadBalancerClass: service.k8s.aws/nlb
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:eu-west-1:123456789012:certificate/replace-me
        service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "8433"
        service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      loadBalancerSourceRanges: [10.20.0.0/16]
    networkPolicy:
      ingressPodSelector: null
      allowedCidrs: [10.30.0.0/24, 10.30.1.0/24]
