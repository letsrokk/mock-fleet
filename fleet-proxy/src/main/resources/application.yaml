quarkus:
  micrometer:
    export:
      prometheus:
        path: /__fleet/proxy/metrics
    binder:
      http-server:
        match-patterns:
          - '.*=/proxy'
  log:
    console:
      json: ${QUARKUS_LOG_CONSOLE_JSON:false}
    category:
      "com.github.letsrokk":
        min-level: TRACE
        level: ${QUARKUS_LOG_CATEGORY_COM_GITHUB_LETSROKK_LEVEL:INFO}
  smallrye-health:
    root-path: /__fleet/proxy/health
  container-image:
    builder: docker
    registry: ghcr.io
    group: letsrokk/mock-fleet
    name: proxy
    additional-tags:
      - latest
    build: true

mock-fleet:
  connection-pools:
    api-max-size: ${MOCK_FLEET_CONNECTION_POOLS_API_MAX_SIZE:50}
    mock-max-size: ${MOCK_FLEET_CONNECTION_POOLS_MOCK_MAX_SIZE:20}
  api:
    base-url: ${MOCK_FLEET_API_BASE_URL:http://localhost:8081}
  routing:
    mode: ${MOCK_FLEET_ROUTING_MODE:HOST}
    host: ${MOCK_FLEET_ROUTING_HOST:mock-fleet.localhost}
