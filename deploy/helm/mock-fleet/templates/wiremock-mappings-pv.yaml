{{- include "mock-fleet.validateStorage" . -}}
{{- if and .Values.fleet.api.storage.persistent (eq .Values.fleet.api.storage.type "s3") }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-pv" (include "mock-fleet.fullname" .) }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
  {{- with .Values.fleet.api.storage.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  storageClassName: {{ .Values.fleet.api.storage.s3.storageClassName | quote }}
  {{- with .Values.fleet.api.storage.s3.mountOptions }}
  mountOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  csi:
    driver: {{ .Values.fleet.api.storage.s3.provisioner | quote }}
    volumeHandle: {{ printf "%s-volume" (include "mock-fleet.fullname" .) }}
    volumeAttributes:
      bucketName: {{ .Values.fleet.api.storage.s3.bucket | quote }}
      authenticationSource: {{ .Values.fleet.api.storage.s3.authenticationSource | quote }}
      cache: emptyDir
      cacheEmptyDirSizeLimit: {{ .Values.fleet.api.storage.s3.cacheSize | quote }}
      cacheEmptyDirMedium: ""
{{- end }}
