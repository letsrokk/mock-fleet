{{- if and .Values.wiremock.versionUpdater.enabled .Values.wiremock.versionUpdater.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mock-fleet.wiremockUpdaterServiceAccountName" . }}
  namespace: {{ include "mock-fleet.namespace" . }}
  labels:
    {{- include "mock-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: wiremock-updater
  {{- with .Values.wiremock.versionUpdater.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
