nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

image:
  repository: ghcr.io/letsrokk/mock-fleet
  tag: latest
  pullPolicy: IfNotPresent

fleet:
  replicas: 2
  namespace: mock-fleet
  podInactivityThreshold: 1M
  podCreationTimeout: 1M
  routing:
    mode: HOST
  resources:
    requests:
      cpu: "0.5"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

wiremock:
  containerName: wiremock
  containerImage: wiremock/wiremock:latest
  config:
    default:
      options: []
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    mocks: []

service:
  type: ClusterIP
  ports:
    http: 80
    targetHttp: 8080
    debug: 5005
    targetDebug: 5005

ingress:
  enabled: false
  host: mock-fleet.localhost
  className: ""
  annotations: {}
  tls: []
  path: /
  pathType: Prefix

securityContext:
  runAsNonRoot: true

storage:
  persistent: false
  type: s3
  annotations: {}
  s3:
    provisioner: s3.csi.aws.com
    storageClassName: ""
    bucket: ""
    path: /mock-fleet
    authenticationSource: driver
    cacheSize: 1Gi
    mountOptions: []

probes:
  liveness:
    path: /__fleet/health/live
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    path: /__fleet/health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  startup:
    path: /__fleet/health/started
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    successThreshold: 1
    failureThreshold: 3

env:
  quinoaUiDir: /workspace/src/main/webui
  quarkusPackageOutputDirectory: /workspace/target
  javaOpts: -Dhazelcast.client.config=/etc/hazelcast/hazelcast-client.yaml
  userDir: /workspace

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

hazelcast:
  client:
    clusterName: dev
  cluster:
    memberCount: 2
  mancenter:
    enabled: false
